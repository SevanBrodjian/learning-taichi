<!doctype html>
<meta charset="utf-8">
<title>MPM4 WebGPU verification + benchmark harness</title>
<style>
  body { background:#0a0e14; color:#dfe6ee; font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; padding:14px; }
  pre { white-space:pre-wrap; }
  .ok { color:#7ee787 } .bad { color:#ff8f8f } .hd { color:#6fd3ee } .wn { color:#ffd24d }
</style>
<h3 class="hd">MPM4 harness — four materials on one grid</h3>
<pre id="log"></pre>
<script src="/web/params.js"></script>
<script src="/web/mpm4-webgpu.js"></script>
<script>
// Drives every browser-side measurement in one page load, then POSTs the artifacts to serve.py.
//
// TIMING PROTOCOL (the part that is easy to get wrong):
//   * performance.now() is clamped to ~100 us in Chromium, so nothing short is ever timed directly.
//     Every wall-clock number is a total over many frames divided by the frame count, and one frame
//     is >= 999 dispatches at snow's substep count.
//   * MOTION IS ASSERTED BEFORE ANY TIMING IS BELIEVED. Exceeding the 8-storage-buffer limit makes
//     the bind group invalid, every dispatch is silently dropped, and the result is a beautiful
//     flat timing curve over trajectories of pure zeros. Every benchmark below reads positions
//     before and after and refuses to report a time if nothing moved.
const LOG = document.getElementById('log');
function say(s, cls) { LOG.innerHTML += '<span class="' + (cls || '') + '">' + s + '</span>\n'; }
async function post(name, body) { await fetch('/save?name=' + name, { method: 'POST', body: body }); }
function now() { return performance.now(); }

function disp(a, b) {                 // mean particle displacement between two position snapshots
  let s = 0, k = Math.min(a.length, b.length) / 2;
  for (let i = 0; i < k; i++) s += Math.hypot(a[2 * i] - b[2 * i], a[2 * i + 1] - b[2 * i + 1]);
  return k ? s / k : 0;
}
function rnd32(seed) { let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

async function main() {
  const p = MPM4.probe();
  if (!p.ok) { say('NO WEBGPU: ' + p.why, 'bad'); await post('done.json', JSON.stringify({ error: p.why })); return; }
  const job = await (await fetch('/verify/job.json?t=' + Date.now())).json();
  await MPM4.getDevice();
  const out = { job_id: job.id, started: Date.now(), device: MPM4.deviceInfo(),
                user_agent: navigator.userAgent, params_physics_version: MPM4.PARAMS.physics_version,
                rollouts: [] };
  say('adapter: ' + JSON.stringify(out.device), 'ok');
  say('params physics_version: ' + MPM4.PARAMS.physics_version +
      '   job physics_version: ' + job.physics_version,
      MPM4.PARAMS.physics_version === job.physics_version ? 'ok' : 'bad');

  // ---------------------------------------------------------------- 1. verification rollouts
  for (const ic of job.ics) {
    const raw = await (await fetch('/verify/' + ic.pts_file)).arrayBuffer();
    const pts = new Float32Array(raw);
    let mats = null;
    if (ic.mat_file) mats = new Int32Array(await (await fetch('/verify/' + ic.mat_file)).arrayBuffer());

    const sim = await MPM4.createSim({ capacity: ic.n, pVol: ic.p_vol, dt: ic.dt });
    if (ic.kind === 'single') {
      sim.add(ic.material, pts, 0, 0);
    } else {
      // groups are contiguous by construction; walk runs of equal material id
      let i0 = 0;
      const NAMES = MPM4.ORDER;
      for (let i = 1; i <= mats.length; i++) {
        if (i === mats.length || mats[i] !== mats[i0]) {
          const name = NAMES.find(nm => MPM4.ID[nm] === mats[i0]);
          sim.add(name, pts.subarray(2 * i0, 2 * i), 0, 0);
          i0 = i;
        }
      }
    }
    if (sim.n !== ic.n) { say('SEEDING MISMATCH ' + ic.name + ' ' + sim.n + ' != ' + ic.n, 'bad'); }

    const t0 = now();
    const traj = new Float32Array(ic.n_frames * ic.n * 2);
    for (let f = 0; f < ic.n_frames; f++) {
      sim.encodeFrame(ic.spf, { readback: true });
      traj.set(await sim.readPositions(), f * ic.n * 2);
    }
    let bad = 0;
    for (let i = 0; i < traj.length; i++) if (!isFinite(traj[i])) bad++;
    const moved = disp(traj.subarray(0, ic.n * 2), traj.subarray((ic.n_frames - 1) * ic.n * 2));
    await post('traj_' + ic.name + '.f32', traj.buffer);
    out.rollouts.push({ ic: ic.name, kind: ic.kind, material: ic.material || null, n: ic.n,
      dt: ic.dt, spf: ic.spf, frames: ic.n_frames, n_nonfinite: bad, mean_displacement: moved,
      wall_ms: now() - t0, file: 'traj_' + ic.name + '.f32',
      pVol: sim.params.pVol, pMass: sim.params.pMass });
    say('rollout ' + ic.name.padEnd(14) + (now() - t0).toFixed(0).padStart(6) + ' ms   nonfinite=' +
      bad + '   mean displacement=' + moved.toFixed(4), (bad || moved < 1e-4) ? 'bad' : 'ok');
    sim.destroy();
  }

  // ---------------------------------------------------------------- 2. the shipped scene, timed
  // Four materials present -> shared dt is snow's 5e-5 -> 333 substeps/frame -> 999 dispatches per
  // frame, paid by every particle in the scene regardless of what it is made of.
  const SDT = MPM4.sharedDt(['fluid', 'elastic', 'snow', 'sand']);
  const SPF = Math.round((1 / 60) / SDT);
  out.shared_dt = SDT; out.substeps_per_frame = SPF;
  say('shared dt = ' + SDT + '  ->  ' + SPF + ' substeps/frame, ' + (3 * SPF) + ' dispatches/frame', 'wn');

  function fourBlobs(n, spread) {
    // equal counts of each material at one density, laid out so they overlap and interact
    const k = Math.floor(n / 4), R = spread || 0.11;
    const g = [];
    const cx = [0.24, 0.42, 0.60, 0.78];
    for (let i = 0; i < 4; i++) {
      g.push({ material: MPM4.ORDER[i], pts: MPM4.seedDisk(cx[i], 0.30 + 0.12 * (i % 2), R, k, 900 + i) });
    }
    return { groups: g, n: 4 * k, pVol: Math.PI * R * R / k };
  }

  out.realtime = [];
  for (const n of job.bench.realtime_n) {
    const sc = fourBlobs(n);
    const sim = await MPM4.createSim({ capacity: sc.n, pVol: sc.pVol, dt: SDT });
    for (const g of sc.groups) sim.add(g.material, g.pts, 0, 0);
    for (let i = 0; i < 3; i++) sim.encodeFrame(SPF);          // warm up pipelines/caches
    await sim.idle();
    sim.encodeFrame(0, { readback: true });
    const before = await sim.readPositions();
    const F = job.bench.realtime_frames;
    const t0 = now();
    for (let f = 0; f < F; f++) sim.encodeFrame(SPF);
    await sim.idle();
    const sustained = (now() - t0) / F;
    sim.encodeFrame(0, { readback: true });
    const after = await sim.readPositions();
    const moved = disp(before, after);
    const g = [];
    for (let i = 0; i < 5; i++) { sim.encodeFrame(SPF, { timed: true }); g.push(await sim.lastGpuNanos()); }
    g.sort((a, b) => a - b);
    out.realtime.push({ n: sc.n, dt: SDT, substeps: SPF, frames: F,
      sustained_ms: sustained, gpu_ms: g[2] / 1e6, fps: 1000 / sustained,
      us_per_substep_gpu: g[2] / 1e3 / SPF, mean_displacement_over_bench: moved,
      motion_ok: moved > 1e-4 });
    say('realtime n=' + String(sc.n).padStart(6) + '  sustained ' + sustained.toFixed(2) + ' ms (' +
      (1000 / sustained).toFixed(1) + ' fps)  gpu ' + (g[2] / 1e6).toFixed(2) + ' ms  moved ' +
      moved.toFixed(4), moved > 1e-4 ? 'ok' : 'bad');
    sim.destroy();
  }

  // ---------------------------------------------------------------- 3. piling / headroom probe
  // 2^24 quanta per particle mass means the u32 mass accumulator SATURATES at 256 particle masses
  // on one node and then WRAPS SILENTLY -- no NaN, no error, the block just detonates. The prior
  // measurement was on a fixed scene; this demo lets a user pile material up by hand, so the worst
  // case is measured by actively crushing everything into one corner with the poke force.
  out.pile = [];
  for (const n of job.bench.pile_n) {
    const k = Math.floor(n / 4);
    const sim = await MPM4.createSim({ capacity: 4 * k, pVol: Math.PI * 0.09 * 0.09 / k, dt: SDT });
    for (let i = 0; i < 4; i++) {
      sim.add(MPM4.ORDER[i], MPM4.seedDisk(0.30 + 0.14 * i, 0.55, 0.09, k, 500 + i), 0, 0);
    }
    // drive everything into the bottom-left corner and hold it there
    sim.poke.on = true; sim.poke.radius = 0.30; sim.poke.rate = 2600; sim.poke.spring = -34;
    let maxM = 0, maxP = 0, worstFrame = -1;
    for (let f = 0; f < job.bench.pile_frames; f++) {
      sim.poke.x = 0.12; sim.poke.y = 0.10;
      sim.poke.vx = -2.2; sim.poke.vy = -2.6;
      sim.syncUniform();
      sim.encodeFrame(SPF, { gridReadback: true });
      const gg = await sim.readGrid();
      for (let c = 0; c < gg.length; c += 4) {
        if (gg[c + 2] > maxM) { maxM = gg[c + 2]; worstFrame = f; }
        if (gg[c + 3] > maxP) maxP = gg[c + 3];
      }
    }
    sim.poke.on = false; sim.syncUniform();
    const kM = MPM4.PARAMS.kM, kV = MPM4.PARAMS.kV;
    const row = { n: 4 * k, frames: job.bench.pile_frames, kM: kM, kV: kV,
      max_node_mass_pm: maxM, max_node_mom_pm: maxP, worst_frame: worstFrame,
      mass_saturates_at_pm: Math.pow(2, 32 - kM), mom_saturates_at_pm: Math.pow(2, 31 - kV),
      mass_headroom: Math.pow(2, 32 - kM) / Math.max(maxM, 1e-9),
      mom_headroom: Math.pow(2, 31 - kV) / Math.max(maxP, 1e-9) };
    out.pile.push(row);
    say('pile n=' + String(4 * k).padStart(6) + '  maxNodeMass ' + maxM.toFixed(1) + ' pm (sat ' +
      row.mass_saturates_at_pm + ', headroom x' + row.mass_headroom.toFixed(2) + ')   maxNodeMom ' +
      maxP.toFixed(1) + ' (headroom x' + row.mom_headroom.toFixed(2) + ')',
      row.mass_headroom > 1.5 ? 'ok' : 'bad');
    sim.destroy();
  }

  // ---------------------------------------------------------------- 4. substeps vs materials present
  // The cost of a scene is set by what is IN it: adding snow halves the shared timestep.
  out.substep_table = [
    { present: ['fluid'], dt: MPM4.sharedDt(['fluid']) },
    { present: ['fluid', 'sand'], dt: MPM4.sharedDt(['fluid', 'sand']) },
    { present: ['fluid', 'elastic', 'sand'], dt: MPM4.sharedDt(['fluid', 'elastic', 'sand']) },
    { present: ['fluid', 'elastic', 'snow', 'sand'], dt: MPM4.sharedDt(['fluid', 'elastic', 'snow', 'sand']) }
  ].map(r => ({ present: r.present, dt: r.dt, substeps_per_frame: Math.round((1 / 60) / r.dt) }));

  out.finished = Date.now();
  out.webgpu_errors = MPM4.errors();
  if (out.webgpu_errors.length) say('WEBGPU ERRORS: ' + out.webgpu_errors.join(' | '), 'bad');
  await post('bench.json', JSON.stringify(out, null, 2));
  await post('done.json', JSON.stringify({ ok: true, at: Date.now() }));
  say('DONE', 'ok');
}
main().catch(async function (e) {
  say('ERROR ' + (e && e.stack ? e.stack : e), 'bad');
  try { await post('done.json', JSON.stringify({ error: String(e && e.message || e), stack: String(e && e.stack || '') })); } catch (_) {}
});
</script>
